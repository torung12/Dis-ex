<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evidence Lite — ฐานข้อมูล</title><style>body{font:14px system-ui;background:#101827;color:#eef4ff;margin:0}main{padding:24px;max-width:1500px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:23px}input,select,button{padding:10px;border:1px solid #425575;border-radius:8px;background:#1b2a40;color:#fff}input{width:330px;max-width:100%;box-sizing:border-box}button{cursor:pointer;background:#5664ee;border:0}section{display:flex;gap:12px;flex-wrap:wrap;margin:15px 0;align-items:center}.wrap{overflow:auto;max-height:75vh;border:1px solid #39485e;border-radius:10px}table{border-collapse:collapse;width:100%;min-width:1050px}th,td{padding:11px 12px;text-align:left;border-bottom:1px solid #34455d;white-space:nowrap}th{position:sticky;top:0;background:#25334a;z-index:1}tr:hover{background:#23344c}tr.selected{background:#344e7a}button:disabled{opacity:.4;cursor:not-allowed}dialog{background:#17243a;color:#fff;border:1px solid #50658b;border-radius:12px;width:min(560px,90vw)}dialog label{display:block;margin:10px 0}dialog input{display:block;width:100%;margin-top:4px}dialog menu{display:flex;gap:10px;justify-content:flex-end;padding:0}td{max-width:380px;overflow:hidden;text-overflow:ellipsis}td a{color:#a9c5ff}td input[type=checkbox]{width:18px;height:18px;cursor:pointer}small{color:#aabbd3}#count{margin:10px 0;color:#bdd5fa}</style></head><body><main><header><div><h1>ฐานข้อมูล Discord Evidence Lite</h1><small>แสดงทุกแถว ทุกกลุ่ม และข้อมูลทั้ง 4 ช่อง • ข้อมูลอยู่ใน Chrome เครื่องนี้</small></div><button id="refresh">รีเฟรช</button></header><section><input id="search" placeholder="ค้นหากลุ่ม / รอบ / Steam ID / ลิงก์"><select id="group"><option value="">ทุกกลุ่ม</option></select><select id="state"><option value="">ทุกสถานะ</option><option value="done">เสร็จ</option><option value="pending">คงเหลือ</option></select><button id="export">ส่งออก CSV</button><button id="add">+ เพิ่มแถว</button><button id="edit" disabled>แก้ไขแถว</button><button id="delete" disabled>ลบแถวที่เลือก (0)</button><button id="selectVisible">เลือกแถวที่แสดงทั้งหมด</button><button id="clearSelection">ยกเลิกการเลือก</button><button id="randomOne" disabled>สุ่มแถวที่เลือก</button><button id="randomGroup">สุ่มกลุ่มที่กรอง</button><button id="randomAll">สุ่มทุกกลุ่ม</button></section><div id="count"></div><div class="wrap"><table><thead><tr><th><input type="checkbox" id="checkAll" title="เลือกแถวที่แสดงทั้งหมด" style="width:18px"></th><th>กลุ่ม</th><th>รอบ</th><th>Steam ID</th><th>รหัส 1</th><th>รหัส 2</th><th>รหัส 3</th><th>สถานะ</th></tr></thead><tbody id="body"></tbody></table></div><p><small>ติ๊กเลือกได้หลายแถวเพื่อลบพร้อมกัน • คลิกแถวเพื่อแก้ไขหรือสุ่ม • การสุ่ม URL ไม่สร้างหลักฐานจริง กรุณาตรวจสอบก่อนใช้งาน</small></p><dialog id="editor"><form method="dialog" id="editForm"><h2 id="editorTitle">ข้อมูลแถว</h2><label>กลุ่ม<input id="eGroup" required></label><label>จำนวนรอบ (เพิ่มแถวจะสร้างรอบ 1 ถึงจำนวนนี้)<input id="eRound" type="number" min="1" step="1" required></label><label>Steam ID<input id="eSteam"></label><label>รหัส / ลิงก์ 1<input id="eCode1"></label><label>รหัส / ลิงก์ 2<input id="eCode2"></label><label>รหัส / ลิงก์ 3<input id="eCode3"></label><menu><button type="button" id="cancel">ยกเลิก</button><button type="submit" id="save">บันทึก</button></menu></form></dialog></main><script src="database.js"></script></body></html>
